<!DOCTYPE html>
    <html>
    <head>
        <title>FORMULA HUB</title>

        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <main class="StartPage">

            <h1>FORMULA HUB</h1>

            <p>Formula Hub is an all in on website <br> for calculating formulas that you may encounter in math and physics. <br>
                You can find the formulas you need, enter your values, <br> and get perfect results to your questions.</p>
        
            <div class="categoryButtons">
                <button id ="allFormulaButton">ALL FORMULAS</button>
                <button id ="mathButton">MATH FORMULAS</button>
                <button id ="physicsButton">PHYSICS FORMULAS</button>
            </div>
        </main>
        <main class="formulaPage">
            <h1>ALL FORMULAS</h1>

            <section class="mathSection">
                <h2>MATHEMATICS</h2>
                <div class="formulaContainer">
                    <button class="formulaButton">RECTANGLE AREA</button>
                    <button class="formulaButton">RECTANGLE PERIMETER</button>
                    <button class="formulaButton">SQUARE AREA</button>
                    <button class="formulaButton">SQUARE PERIMETER</button>
                    <button class="formulaButton">TRIANGLE AREA</button>
                    <button class="formulaButton">TRIANGLE PERIMETER</button>
                    <button class="formulaButton">CIRCLE AREA</button>
                    <button class="formulaButton">CIRCLE CIRCUMFERENCE</button>
                    <button class="formulaButton">TRAPEZOID AREA</button>
                    <button class="formulaButton">PARALLELOGRAM AREA</button>
                    <button class="formulaButton">SLOPE</button>
                    <button class="formulaButton">DISTANCE FORMULA</button>
                    <button class="formulaButton">MIDPOINT FORMULA</button>
                    <button class="formulaButton">PYTHAGOREAN THEOREM</button>
                    <button class="formulaButton">CUBE VOLUME</button>
                    <button class="formulaButton">RECTANGULAR PRISM VOLUME</button>
                    <button class="formulaButton">CYLINDER VOLUME</button>
                    <button class="formulaButton">CONE VOLUME</button>
                    <button class="formulaButton">SPHERE VOLUME</button>
                    <button class="formulaButton">TRIANGULAR PRISM VOLUME</button>
                    
                </div>
            </section>

            <section class="physicsSection">
                <h2>PHYSICS</h2>
                <div class="formulaContainer">
                    <button class="formulaButton">SPEED</button>
                    <button class="formulaButton">AVERAGE VELOCITY</button>
                    <button class="formulaButton">ACCELERATION</button>
                    <button class="formulaButton">DISTANCE</button>
                    <button class="formulaButton">TIME</button>
                    <button class="formulaButton">DISPLACEMENT</button>
                    <button class="formulaButton">KINEMATICS EQUATION - FINAL VELOCITY</button>
                    <button class="formulaButton">KINEMATICS EQUATION - DISPLACEMENT</button>
                    <button class="formulaButton">KINEMATICS EQUATION - FINAL VELOCITY SQUARED</button>
                    <button class="formulaButton">KINEMATICS EQUATION - AVERAGE VELOCITY</button>
                    <button class="formulaButton">KINAMATICS EQUATION - DISPLACEMENT </button>
                </div>
            </section>

            <button id="backButton">BACK</button>
        </main>
        <main class="mathFormulaPage">
            

        </main>
        <script src="./script.js"></script>
    </body>
    </html>
